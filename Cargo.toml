[workspace]
members = [".", "runtime", "ui/egui"]
# Plain `cargo build` / `cargo build --release` → lib + pwctl + UI (pmux).
# Server/WSL sin GUI: `cargo build --release --bin pwctl`
default-members = [".", "runtime", "ui/egui"]
resolver = "2"

[package]
name = "pmux"
version = "0.1.0"
edition = "2021"

[dependencies]
ulid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"
dirs = "6"
toml = "0.8"
pulldown-cmark = "0.13"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
